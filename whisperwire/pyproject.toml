[project]
name = "whisperwire"
version = "0.1.0"
description = "An Agent Security Gateway between agents and their tools"
requires-python = ">=3.11"
dependencies = [
  "mcp[cli]>=2,<3",
  "httpx>=0.27,<1",
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
rig = []
test = ["pytest", "matplotlib"]

[project.scripts]
whisperwire = "whisperwire.whisperwire:main"
whisperwire-sketch = "whisperwire.sketch.cli:main"
whisperwire-shell = "whisperwire.sketch.shell_guard:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
]
