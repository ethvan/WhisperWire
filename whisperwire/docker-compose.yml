services:
  # Dummy MCP server using mcp sdk's outdated fastmcp impl for simplicity.
  mcp-server:
    build:
      context: ./server
      dockerfile: Dockerfile.server
    container_name: mcp-server
    ports:
      - "9000:9000"

  whisperwire:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: whisperwire
    depends_on:
      - mcp-server
    ports:
      - "8080:8080"
    environment:
      WHISPERWIRE_HOST: "0.0.0.0"
      WHISPERWIRE_PORT: "8080"
      WHISPERWIRE_UPSTREAM: "http://mcp-server:9000/mcp"
    volumes:
      - ./logs:/app/logs
